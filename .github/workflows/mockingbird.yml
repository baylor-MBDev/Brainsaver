name: Mockingbird site

# Tests the growth system and deploys the Mockingbird website to Cloudflare.
# Deploys only run on main once Cloudflare is set up (see
# mockingbird/docs/SETUP.md); until then they skip with a notice.

on:
  push:
    branches: [main]
    paths:
      - 'mockingbird/**'
      - '.github/workflows/mockingbird.yml'
  pull_request:
    paths:
      - 'mockingbird/**'
      - '.github/workflows/mockingbird.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mockingbird-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mockingbird
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mockingbird/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build the website
        run: node site/build.js

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Secrets can't be used in step `if:` conditions, so map them to env and
    # check them in a step.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: mockingbird
    steps:
      - uses: actions/checkout@v4
      - name: Check Cloudflare setup
        id: cf
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && ! grep -q REPLACE_WITH_D1_DATABASE_ID site/wrangler.jsonc; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping deploy. Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets and set database_id in mockingbird/site/wrangler.jsonc (mockingbird/docs/SETUP.md)."
          fi
      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mockingbird/package-lock.json
      - if: steps.cf.outputs.ready == 'true'
        run: npm ci
      - if: steps.cf.outputs.ready == 'true'
        name: Build the website
        run: node site/build.js
      - if: steps.cf.outputs.ready == 'true'
        name: Apply database migrations
        working-directory: mockingbird/site
        run: npx --yes wrangler@4 d1 migrations apply mockingbird --remote
      - if: steps.cf.outputs.ready == 'true'
        name: Deploy to Cloudflare
        working-directory: mockingbird/site
        run: npx --yes wrangler@4 deploy
