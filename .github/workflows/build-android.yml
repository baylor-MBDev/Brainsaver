name: Build Android APK

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check for Play release keystore
        id: signing
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - run: npm ci
      - name: Unit tests
        run: npm test
      - name: Fetch pose model
        run: ./scripts/fetch-pose-model.sh
      - name: Generate native Android project
        # Every build gets a higher versionCode than the last (Play requires
        # it). Offset by 100 so it stays above the hand-set codes 1-7.
        run: |
          export ANDROID_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          echo "versionCode $ANDROID_VERSION_CODE"
          npx expo prebuild --platform android --no-install
          grep -q "versionCode $ANDROID_VERSION_CODE" android/app/build.gradle
      - name: Decode Play release keystore
        if: steps.signing.outputs.present == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      - name: Build release APK (Play keystore)
        if: steps.signing.outputs.present == 'true'
        run: |
          cd android && ./gradlew assembleRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
      - name: Build release APK (debug-signed, no Play keystore configured yet)
        if: steps.signing.outputs.present == 'false'
        run: cd android && ./gradlew assembleRelease
      - name: Build Play Store bundle (AAB)
        if: steps.signing.outputs.present == 'true'
        run: |
          cd android && ./gradlew bundleRelease \
            -PRELEASE_STORE_FILE=release.keystore \
            -PRELEASE_STORE_PASSWORD="${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            -PRELEASE_KEY_ALIAS="${{ secrets.ANDROID_KEY_ALIAS }}" \
            -PRELEASE_KEY_PASSWORD="${{ secrets.ANDROID_KEY_PASSWORD }}"
      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk doomtype.apk
      - name: Rename AAB
        if: steps.signing.outputs.present == 'true'
        run: cp android/app/build/outputs/bundle/release/app-release.aab doomtype.aab
      # Play Console needs both of these to be right: every declared
      # permission has to be justified in the listing, and native libraries
      # must be 16 KB page-aligned for apps targeting Android 15+.
      - name: Play readiness report
        continue-on-error: true
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          echo "== Permissions in the APK =="
          "$BT/aapt2" dump permissions doomtype.apk
          echo "== Where each permission comes from =="
          grep -A1 '^uses-permission#' android/app/build/outputs/logs/manifest-merger-release-report.txt \
            | grep -v '^--$' | sed -E 's/ +/ /g; s/(\]).*/\1/'
          echo "== 16 KB zip alignment =="
          "$BT/zipalign" -c -P 16 4 doomtype.apk && echo "zip alignment OK"
          echo "== ELF LOAD alignment, arm64-v8a (needs 0x4000 or higher) =="
          rm -rf so && unzip -q -o doomtype.apk 'lib/arm64-v8a/*' -d so
          for f in so/lib/arm64-v8a/*.so; do
            align=$(readelf -lW "$f" | awk '$1 == "LOAD" {print $NF}' | sort -u | tr '\n' ' ')
            case "$align" in *0x1000*) verdict="NOT 16KB" ;; *) verdict="ok" ;; esac
            echo "$verdict  $(basename "$f")  $align"
          done
      - name: Attach build to release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DOOMTYPE Android build ${{ github.run_number }}
          fail_on_unmatched_files: false
          body: |
            Installable Android APK, built from `${{ github.sha }}`.

            On your phone: download `doomtype.apk`, open it, and allow
            installing from this source when prompted.

            ${{ steps.signing.outputs.present == 'true' && '`doomtype.aab` is the Play Store upload bundle, signed with the release keystore.' || '' }}
          files: |
            doomtype.apk
            doomtype.aab
      # Branch builds are for checking that things compile; keep them out of
      # the public release list.
      - name: Upload branch build
        if: github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: doomtype-${{ github.run_number }}
          path: doomtype.apk
          retention-days: 7
